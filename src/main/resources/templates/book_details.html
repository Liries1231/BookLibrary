<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Details</title>
</head>
<body>
<h1 th:text="${book.title}"></h1>
<p>Author: <a th:href="@{/authors/{authorId}/books(authorId=${book.author.id})}"
              th:text="${book.author.author_name}"></a>
<p>Book ID: <span th:text="${book.id}"></span></p>
</body>
</html>
