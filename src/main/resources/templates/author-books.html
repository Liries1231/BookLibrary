<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books by Author</title>
</head>
<body>
<h1>Books by Author</h1>

<h2 th:text="${author.author_name}">Author Name</h2>

<ul>
    <li th:each="book : ${books}">
        <span th:text="${book.title}">Book Title</span> - ID: <span th:text="${book.id}">Book ID</span>
    </li>
</ul>


<a th:href="@{/authors}">Back to Authors</a>
</body>
</html>
